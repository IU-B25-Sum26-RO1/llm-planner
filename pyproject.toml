[project]
name = "llm-planner"
version = "0.1.0"
description = "Voice-controlled UR10e manipulation with an LLM task planner"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiohttp>=3.14.1",
    "httpx>=0.28.1,<1",
    "numpy<2.0.0",
    "openai>=2.44.0",
    "opencv-python-headless<4.11.0",
    "pydantic>=2.13.4",
    "sounddevice>=0.5.5",
    "vosk>=0.3.45; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
